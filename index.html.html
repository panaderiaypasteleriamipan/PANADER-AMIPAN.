<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MIPAN 2025 - Panadería & Pastelería</title>
  <style>
    :root {
      --primary-color: #c0693a;
      --secondary-color: #3d2314;
      --bg-color: #fcf8f3;
      --card-bg: #ffffff;
      --border-color: #ebd8c8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--secondary-color);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Encabezado Principal */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 5%;
      background-color: #ffffff;
      border-bottom: 2px solid var(--border-color);
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand-container {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .brand-logo {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--primary-color);
    }

    .brand-name {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--primary-color);
      letter-spacing: 1px;
    }

    .social-link {
      font-weight: 600;
      color: var(--primary-color);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border: 1px solid var(--primary-color);
      border-radius: 20px;
      transition: all 0.3s ease;
    }

    .social-link:hover {
      background-color: var(--primary-color);
      color: #ffffff;
    }

    /* Catálogo de Productos */
    main {
      flex: 1;
      padding: 40px 5%;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }

    .section-title {
      text-align: center;
      margin-bottom: 30px;
      font-size: 1.6rem;
      color: var(--secondary-color);
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 25px;
    }

    .product-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      box-shadow: 0 4px 8px rgba(0,0,0,0.04);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 6px 12px rgba(0,0,0,0.08);
    }

    .product-image-container {
      width: 100%;
      height: 200px;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .product-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .product-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--secondary-color);
    }

    /* Pie de página y Firma */
    footer {
      text-align: center;
      padding: 25px 15px;
      background-color: var(--secondary-color);
      color: var(--border-color);
      font-size: 0.95rem;
      margin-top: 50px;
    }

    footer strong {
      color: #ffffff;
    }
  </style>
</head>
<body>

  <!-- Header: Logo junto al nombre e Instagram -->
  <header>
    <div class="brand-container">
      <img src="logo_2.jpg" alt="Logo MIPAN" class="brand-logo">
      <span class="brand-name">MIPAN</span>
    </div>
    <a href="https://instagram.com/mipan2025" target="_blank" rel="noopener noreferrer" class="social-link">
      <span>@mipan2025</span>
    </a>
  </header>

  <!-- Catálogo: Imagen enlazada con cada nombre -->
  <main>
    <h2 class="section-title">Nuestros Productos</h2>
    
    <div class="product-grid">
      
      <div class="product-card">
        <div class="product-image-container">
          <img src="pan-canilla.jpg" alt="Pan Canilla">
        </div>
        <h3 class="product-title">Pan Canilla</h3>
      </div>

      <div class="product-card">
        <div class="product-image-container">
          <img src="pan-campesino.jpg" alt="Pan Campesino">
        </div>
        <h3 class="product-title">Pan Campesino</h3>
      </div>

      <div class="product-card">
        <div class="product-image-container">
          <img src="cachito-jamon.jpg" alt="Cachito de Jamón">
        </div>
        <h3 class="product-title">Cachito de Jamón</h3>
      </div>

      <div class="product-card">
        <div class="product-image-container">
          <img src="pan-sobado.jpg" alt="Pan Sobado">
        </div>
        <h3 class="product-title">Pan Sobado</h3>
      </div>

      <div class="product-card">
        <div class="product-image-container">
          <img src="pan-dulce.jpg" alt="Pan Dulce">
        </div>
        <h3 class="product-title">Pan Dulce</h3>
      </div>

      <div class="product-card">
        <div class="product-image-container">
          <img src="croissant.jpg" alt="Croissant">
        </div>
        <h3 class="product-title">Croissant</h3>
      </div>

    </div>
  </main>

  <!-- Footer con firma de desarrollador -->
  <footer>
    <p>Sitio web desarrollado por <strong>Smith Business Solutions</strong></p>
  </footer>

</body>
</html>
